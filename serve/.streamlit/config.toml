# Dark theme; colors match the design tokens at the top of app.py
[theme]
base = "dark"
backgroundColor = "#0b0d10"
secondaryBackgroundColor = "#13161b"
textColor = "#f0efec"
primaryColor = "#9085e9"

# Hide Streamlit's developer toolbar (Deploy button, menu) on the public site
[client]
toolbarMode = "minimal"
