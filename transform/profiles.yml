# ══════════════════════════════════════════════════════════════════════════════
# dbt profiles — connections for the transform job and local builds
#
# The profile name must match dbt_project.yml.
#
#   gcp    production — the transform job, as its attached service account
#   local  development — your gcloud application-default credentials; writes
#          to dev_silver / dev_gold (macros/generate_schema_name.sql)
#
# Both authenticate with method: oauth (no keyfile) and read the real bronze.
#
# maximum_bytes_billed (50 GiB, ~$0.30) fails any single query that would bill
# more: the transform's cost guardrail, in place of a project-wide daily cap
# (decision 0004). Sized for the biggest query the transform can run, a full
# rebuild of silver.mbta_alerts__by_route, which reads every alert snapshot;
# that outgrows the limit around mid-2030 (tracked in docs/roadmap.md). Hourly
# incremental runs read only new snapshots (KBs).
# ══════════════════════════════════════════════════════════════════════════════

mbta_reliability_analytics:
  target: gcp
  outputs:
    local:
      type: bigquery
      method: oauth
      project: mbta-reliability-analytics
      # Every model sets its own dataset, so this is only a fallback, and it's
      # a dev one: if a model ever loses its +schema (a stale partial-parse
      # cache in target/ did, 2026-11-03), a local build lands in dev_silver,
      # never in production.
      dataset: dev_silver
      location: us-east1
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
      maximum_bytes_billed: 53687091200  # 50 GiB per query (see header)

    gcp:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'mbta-reliability-analytics') }}"
      dataset: silver  # required default; every model sets its own dataset
      location: us-east1
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
      maximum_bytes_billed: 53687091200  # 50 GiB per query (see header)
