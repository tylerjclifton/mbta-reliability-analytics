version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Gold — cross-source tables served to the dashboard (rebuilt every run)
#
# Column meanings match their silver sources; see models/silver/_silver__models.yml.
# Tests here guard the joins: the grain still holds after joining, and every
# ridership day found its weather.
# ══════════════════════════════════════════════════════════════════════════════

models:
  - name: rail_incidents
    description: >
      One row per incident × route — the alerts the MBTA posted for one event,
      collapsed. The dashboard's alert counts, durations, and cause/effect
      breakdowns all read this table.
    data_tests:
      - unique_combination:
          arguments:
            columns: [incident_id, route_id]
    columns:
      - name: incident_id
        description: "{{ doc('incident_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests: [not_null]
      - name: incident_cause
        description: Cause shared by the incident's alerts (e.g. "Disabled Train").
      - name: incident_effect
        description: Effect shared by the incident's alerts (e.g. "Delay").
      - name: incident_header
        description: Short text of the incident's most recent alert.
      - name: incident_description
        description: Long text of the incident's most recent alert.
      - name: incident_severity
        description: Highest severity among the incident's alerts (0–10).
      - name: incident_start_at
        description: Earliest start among the incident's alerts (UTC).
        data_tests: [not_null]
      - name: incident_end_at
        description: Latest end among the incident's alerts (UTC); NULL while any is ongoing.
      - name: incident_duration_minutes
        description: Minutes from start to end, or to now while ongoing.
      - name: alert_count
        description: Number of MBTA alerts posted for this incident.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1
      - name: is_in_feed
        description: True when any of the incident's alerts is still listed by the API.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"

  - name: rail_ridership
    description: >
      One row per service date × line — gated entries, the number of alerts
      active on the line that day, and that day's weather at Boston Logan.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, line_name]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
      - name: gated_entries
        description: Fare-gate entries across the line's stations that day.
      - name: active_incident_count
        description: Distinct incidents on any of the line's routes active at some point that service date.
      - name: most_severe_effect
        description: >
          The most severe effect among incidents active on the line that day —
          Shuttle, then Suspension, then Delay — or NULL on a calm day. Station
          closures and service changes are ignored (a long closure would
          otherwise mark every day).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Shuttle', 'Suspension', 'Delay']
      - name: avg_temperature_f
        description: Daily mean temperature at Boston Logan, °F.
        data_tests:
          # Every ridership day should have weather — NOAA runs ahead of the
          # MBTA's ridership publishing. A gap means the weather ingest broke.
          - not_null:
              config:
                severity: warn
      - name: precipitation_in
        description: Precipitation (liquid equivalent, melted snow included), inches.
      - name: snowfall_in
        description: New snowfall, inches.
      - name: ridership_ingested_at
        description: When the ridership version used was ingested (UTC).
      - name: weather_ingested_at
        description: When the weather version used was ingested (UTC).
