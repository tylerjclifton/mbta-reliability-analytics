name: 'mbta_reliability_analytics'  # project name for this dbt project
version: '1.0.0'  # project version
config-version: 2  # dbt config version

# Profile to use for dbt runs
profile: 'mbta_reliability_analytics'

# File and folder locations
model-paths: ["models"]  # where dbt models are stored
# analysis-paths: ["analyses"]  # (optional) where analysis files are stored
test-paths: ["tests"]  # where dbt tests are stored
# seed-paths: ["seeds"]  # (optional) where seed files are stored
macro-paths: ["macros"]  # where dbt macros are stored
# snapshot-paths: ["snapshots"]  # (optional) where snapshots are stored

# Directories to be removed by `dbt clean`
clean-targets:
  - "target"  # dbt build artifacts
  - "dbt_packages"  # dbt package dependencies

# Project-wide variables
vars:
  # MBTA service dates and NOAA observation days are both Eastern time
  local_timezone: 'America/New_York'

  # Alert effects that don't affect train service (amenities, facilities,
  # informational notices). Bronze keeps them; silver.mbta_alerts drops them.
  non_service_alert_effects:
    - NOTICE
    - STATION_ISSUE
    - ESCALATOR_CLOSURE
    - ELEVATOR_CLOSURE
    - PARKING_CLOSURE
    - PARKING_ISSUE
    - BIKE_ISSUE
    - DOCK_CLOSURE
    - DOCK_ISSUE
    - EXTRA_SERVICE

# Model configuration — one folder per medallion layer, one dataset per folder
# See: https://docs.getdbt.com/docs/configuring-models
#   bronze — append-only tables written by ingest jobs; declared as sources only
#   silver — views: the latest version of each record per source, cleaned and typed
#   gold   — tables the dashboard reads, rebuilt every run
models:
  mbta_reliability_analytics:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
