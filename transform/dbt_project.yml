# ══════════════════════════════════════════════════════════════════════════════
# dbt project — medallion transforms from bronze to the dashboard's gold tables
#
# Run by the transform job (Dockerfile): `dbt build`, then `dbt source freshness`.
# Connection settings live in profiles.yml.
# ══════════════════════════════════════════════════════════════════════════════

name: 'mbta_reliability_analytics'
version: '1.0.0'
config-version: 2
profile: 'mbta_reliability_analytics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

# Project-wide variables
vars:
  # MBTA service dates and NOAA observation days are both Eastern time
  local_timezone: 'America/New_York'

  # The first ingest run that captured each alert's full JSON (UTC), in
  # bronze.mbta_alerts (decision 0002). Alerts seen from this run on come from
  # the project's snapshots; alerts that ended before it come from the MBTA's
  # LAMP archive (silver/mbta_alerts__resolved.sql; decision 0016).
  alerts_raw_capture_start: '2026-10-24 14:11:39.835891'

  # First day of continuous LAMP alert history (Eastern): subway alerts never
  # go a week without one after it, and are sparse before (decision 0016)
  lamp_alerts_start: '2019-09-05'

  # Alert effects that don't affect train service (amenities, facilities,
  # informational notices). Bronze keeps them; silver.mbta_alerts__resolved
  # drops them.
  non_service_alert_effects:
    - NOTICE
    - STATION_ISSUE
    - ACCESS_ISSUE
    - FACILITY_ISSUE
    - ESCALATOR_CLOSURE
    - ELEVATOR_CLOSURE
    - PARKING_CLOSURE
    - PARKING_ISSUE
    - BIKE_ISSUE
    - DOCK_CLOSURE
    - DOCK_ISSUE
    - EXTRA_SERVICE

# Model configuration — one folder per medallion layer, one dataset per folder
# See: https://docs.getdbt.com/docs/configuring-models
#   bronze — append-only tables written by ingest jobs; declared as sources only
#   silver — <bronze table>__<step> views (__base is each source's cleaned
#            copy), except mbta_alerts__base, mbta_alerts__by_route, and
#            lamp_alerts__base: incremental tables, so each run reads only
#            new bronze rows.
#            Details in models/silver/_silver__models.yml (decision 0010)
#   gold   — tables the dashboard reads, rebuilt every run
models:
  mbta_reliability_analytics:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
