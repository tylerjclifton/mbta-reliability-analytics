version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Silver — each source's cleaned copy, and the steps built on it
#
# Models are named <bronze table>__<step> (docs/conventions.md); which are
# views and which are incremental tables, and why, is decision 0010.
#
# Tests run in `dbt build` before gold is rebuilt; an error-severity failure
# skips everything downstream, so bad data never reaches the dashboard.
#   unique_combination / unique             → the model's grain holds
#   not_null_columns                        → keys and required fields are set
#   accepted_values / relationships         → keys join cleanly across sources
#   accepted_range                          → values are physically plausible
# The alert rules also have unit tests on made-up rows
# (_silver__unit_tests.yml).
# ══════════════════════════════════════════════════════════════════════════════

models:

  # ── Cleaned copies ──────────────────────────────────────────────────────────

  - name: mbta_alerts__base
    description: >
      One row per alert since full-JSON capture began (2026-10-24), every
      mode: its latest version, the JSON's fields typed (the same columns as
      lamp_alerts__base; enums as the API sends them), the JSON itself, and
      first/last seen. Incremental table, so each run reads only new alert
      snapshots (see model header).
    data_tests:
      - not_null_columns:
          arguments:
            columns: [alert_id, alert_effect, alert_created_at, alert_json,
                      first_seen_at, last_seen_at]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [unique]
      - name: alert_header
        description: "{{ doc('alert_header') }}"
      - name: alert_description
        description: "{{ doc('alert_description') }}"
      - name: alert_cause
        description: MBTA cause enum (e.g. SIGNAL_PROBLEM).
      - name: alert_effect
        description: MBTA effect enum (e.g. DELAY, SHUTTLE).
      - name: alert_severity
        description: "{{ doc('alert_severity') }}"
      - name: alert_duration_certainty
        description: MBTA enum (KNOWN, ESTIMATED, UNKNOWN).
      - name: posted_start_at
        description: Start of the first active period (UTC); NULL when it posted none.
      - name: posted_end_at
        description: End of that period (UTC); NULL when open-ended.
      - name: active_periods
        description: "{{ doc('active_periods') }}"
      - name: alert_created_at
        description: "{{ doc('alert_created_at') }}"
      - name: alert_updated_at
        description: "{{ doc('alert_updated_at') }}"
      - name: alert_closed_at
        description: >
          When the MBTA closed the alert (UTC), if a snapshot caught it after
          closing; alerts stay in the feed only a few minutes after.
      - name: informed_entities
        description: "{{ doc('informed_entities') }}"
      - name: alert_json
        description: The alert's latest JSON:API object, exactly as the API returned it.
      - name: first_seen_at
        description: "{{ doc('first_seen_at') }}"
      - name: last_seen_at
        description: "{{ doc('last_seen_at') }}"

  - name: lamp_alerts__base
    description: >
      One row per rail alert in the MBTA's LAMP archive: its latest version,
      renamed toward the API's names, with its informed entities and first
      posted active period. Incremental table that reads bronze only after a
      new load (see model header; decision 0016).
    data_tests:
      - not_null_columns:
          arguments:
            columns: [alert_id, alert_effect, alert_created_at, ingested_at]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [unique]
      - name: alert_cause
        description: MBTA cause enum, as the API's cause (LAMP's cause_detail).
      - name: alert_effect
        description: MBTA effect enum, as the API's effect (LAMP's effect_detail).
      - name: posted_start_at
        description: >
          Start of the first active period (UTC) in the latest version that
          has any; the version LAMP adds when an alert closes has none. NULL
          when no version posted one.
      - name: posted_end_at
        description: End of that period (UTC); NULL when open-ended.
      - name: active_periods
        description: "{{ doc('active_periods') }}"
      - name: first_posted_end_at
        description: >
          The earliest end the alert's first version posted (UTC): the MBTA's
          first estimate of when it would be over. NULL when it posted none.
      - name: alert_created_at
        description: "{{ doc('alert_created_at') }}"
      - name: alert_updated_at
        description: When the latest version was posted (UTC).
      - name: alert_closed_at
        description: "{{ doc('alert_closed_at') }}"
      - name: informed_entities
        description: >
          The latest version's distinct informed entities (route_id, stop_id,
          direction_id); a NULL direction means both.
      - name: ingested_at
        description: The latest LAMP load (UTC); the table's incremental marker.
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_routes__base
    description: One row per rail route — the latest snapshot, plus the line it belongs to.
    data_tests:
      - not_null_columns:
          arguments:
            columns: [route_id, line_name]
    columns:
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [unique]
      - name: route_name
        description: "{{ doc('route_name') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests:
          - accepted_values:
              arguments:
                # Anchor reused by mbta_gated_entries__base.line_name below.
                values: &rail_lines ['Red Line', 'Orange Line', 'Blue Line', 'Green Line']
      - name: route_description
        description: MBTA route description (e.g. "Rapid Transit").
      - name: route_type
        description: Light Rail or Heavy Rail.
      - name: route_color
        description: Route hex color without the leading #.
      - name: route_destinations
        description: Terminal stations, one per direction (direction_id indexes it).
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_shapes__base
    description: >
      One row per shape × route in the latest snapshot: the path each rail route
      follows, as an encoded polyline. Only the latest run, so retired shapes
      drop off (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [shape_id, route_id]
      - not_null_columns:
          arguments:
            columns: [shape_id, route_id, shape_polyline, is_canonical]
    columns:
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('mbta_routes__base')
                field: route_id
      - name: shape_polyline
        description: "{{ doc('shape_polyline') }}"
      - name: is_canonical
        description: True for the route's official paths; false for their variants.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_stops__base
    description: >
      One row per stop × route: every rail station and the stops inside it
      (platforms, entrances, nodes), each mapped to its station. A station and
      its child stops repeat for each route serving it.
    data_tests:
      - unique_combination:
          arguments:
            columns: [stop_id, route_id]
      - not_null_columns:
          arguments:
            columns: [stop_id, route_id, station_id]
    columns:
      - name: stop_id
        description: MBTA stop ID — a station (place-…) or a stop inside one (platform, entrance, node).
      - name: route_id
        description: "Route whose stations were requested. {{ doc('route_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('mbta_routes__base')
                field: route_id
      - name: station_id
        description: "{{ doc('station_id') }} A station's own row has station_id = stop_id."
      - name: station_name
        description: Station name (child stops carry their station's name).
      - name: stop_type
        description: Platform, Station, Entrance, Node, or Boarding Area (GTFS location_type).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Platform', 'Station', 'Entrance', 'Node', 'Boarding Area']
      - name: stop_platform_name
        description: A platform's direction or destination (e.g. "Boston College"); NULL otherwise.
      - name: stop_latitude
        description: WGS84 latitude.
        data_tests:
          # Greater Boston; a value outside means a bad coordinate.
          - accepted_range:
              arguments:
                min_value: 42.0
                max_value: 42.7
      - name: stop_longitude
        description: WGS84 longitude.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -71.4
                max_value: -70.8
      - name: stop_municipality
        description: City or town.
      - name: is_wheelchair_accessible
        description: "{{ doc('is_wheelchair_accessible') }}"
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_gated_entries__base
    description: One row per service date × line — the latest published gated-entry count.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, line_name]
      - not_null_columns:
          arguments:
            columns: [service_date, line_name, gated_entries]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: *rail_lines
      - name: gated_entries
        description: "{{ doc('gated_entries') }}"
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: noaa_weather__base
    description: One row per observation date — quality-checked daily weather at Boston Logan, in US units.
    data_tests:
      - not_null_columns:
          arguments:
            columns: [observation_date]
    columns:
      - name: observation_date
        description: "{{ doc('observation_date') }}"
        data_tests: [unique]
      - name: station_id
        description: GHCN station ID (USW00014739 = Boston Logan International Airport).
      - name: avg_temperature_f
        description: "{{ doc('avg_temperature_f') }}"
      - name: max_temperature_f
        description: Daily maximum temperature, °F.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -40
                max_value: 120
      - name: min_temperature_f
        description: Daily minimum temperature, °F.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -40
                max_value: 120
      - name: precipitation_in
        description: "{{ doc('precipitation_in') }}"
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: snowfall_in
        description: "{{ doc('snowfall_in') }}"
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_monthly_ridership__base
    description: >
      One row per month × day type × mode or line — the MBTA's monthly
      ridership figures, every mode, as of the latest pull, subtotals included
      (decision 0018). Boardings, a transfer counting twice.
    data_tests:
      - unique_combination:
          arguments:
            columns: [month_start, day_type, mode_or_line]
      - not_null_columns:
          arguments:
            columns: [month_start, day_type, mode_or_line]
    columns:
      - name: month_start
        description: First day of the month.
      - name: day_type
        description: Weekday, Saturday, Sunday, or Total (the three together).
        data_tests:
          - accepted_values:
              arguments:
                values: [Weekday, Saturday, Sunday, Total]
      - name: day_count
        description: Days of that type in the month.
      - name: mode_or_line
        description: >
          Mode or line as published; Heavy Rail, Light Rail, and All Bus are
          subtotals of others.
      - name: riders_total
        description: Boardings over the month's days of that type.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: riders_per_day
        description: Boardings per day of that type.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_commuter_rail_boardings__base
    description: >
      One row per service date × line — the MBTA's estimated commuter rail
      boardings, as of the latest pull (decision 0018).
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, line_name]
      - not_null_columns:
          arguments:
            columns: [service_date, line_name]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: line_name
        description: Commuter rail line (e.g. Fitchburg, Providence/Stoughton).
      - name: estimated_boardings
        description: Estimated boardings on the line that day.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_ferry_trips__base
    description: >
      One row per ferry trip leg as of its latest pull, typed. Incremental
      table that overwrites the service days each new load covers (see model
      header; decision 0018).
    data_tests:
      - not_null_columns:
          arguments:
            columns: [service_date, route_id, ingested_at]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: route_id
        description: Ferry route (e.g. F4).
      - name: route_name
        description: Route ID and place as published (e.g. F4-Charlestown).
      - name: trip_id
        description: Trip ID; NULL in older years.
      - name: leg_id
        description: Leg ID (the source's stop_id); NULL in older years.
      - name: scheduled_departure_at
        description: Scheduled departure (UTC).
      - name: actual_departure_at
        description: Actual departure (UTC); NULL when the MBTA has none.
      - name: scheduled_arrival_at
        description: Scheduled arrival (UTC).
      - name: actual_arrival_at
        description: Actual arrival (UTC); NULL when the MBTA has none.
      - name: riders_on
        description: Riders boarding.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: riders_aboard
        description: Riders aboard after boarding.
      - name: riders_off
        description: Riders leaving (published negative; made positive).
      - name: ingested_at
        description: The load the service day's legs came from (UTC); the table's incremental marker.
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_excess_trip_time__base
    description: >
      One row per service date × half hour × line × direction — riders' trip
      times on the Red, Orange, and Blue Lines against a baseline, the MBTA's
      estimates, as of each day's latest pull (decision 0019). Minutes and
      riders within each threshold are totals over the group's riders.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, half_hour_start, route_id, direction]
      - not_null_columns:
          arguments:
            columns: [service_date, half_hour_start, ingested_at]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: day_type
        description: Weekday, Saturday, Sunday, or Holiday.
        data_tests:
          - accepted_values:
              arguments:
                values: [Weekday, Saturday, Sunday, Holiday]
      - name: half_hour_start
        description: Start of the half hour, Eastern.
      - name: service_period
        description: AM PEAK, PM PEAK, or OFF-PEAK (the MBTA's service delivery policy).
        data_tests:
          - accepted_values:
              arguments:
                values: [AM PEAK, PM PEAK, OFF-PEAK]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [Red, Orange, Blue]
              config:
                # The MBTA plans to add the Green Line: news, not an error.
                severity: warn
      - name: direction
        description: NB, SB, EB, or WB.
      - name: riders_estimated
        description: The MBTA's estimate of riders in the group.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: trip_minutes
        description: Actual trip minutes (wait plus travel), summed over the riders.
      - name: wait_minutes
        description: Actual wait minutes, summed over the riders.
      - name: travel_minutes
        description: Actual travel minutes, summed over the riders.
      - name: baseline_trip_minutes
        description: Baseline trip minutes, summed over the riders.
      - name: baseline_wait_minutes
        description: Baseline wait minutes, summed over the riders.
      - name: baseline_travel_minutes
        description: Baseline travel minutes, summed over the riders.
      - name: riders_within_5_minutes
        description: Riders who arrived within 5 minutes of the baseline.
      - name: riders_within_20_minutes
        description: Riders who arrived within 20 minutes of the baseline.
      - name: riders_within_20_percent
        description: Riders whose trip ran no more than 20% over the baseline.
      - name: riders_within_30_percent
        description: Riders whose trip ran no more than 30% over the baseline.
      - name: ingested_at
        description: The load the service day's rows came from (UTC).
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_commuter_rail_reliability__base
    description: >
      One row per row of the file (a line or branch × service date × peak or
      off-peak) — commuter rail trains measured, on time, and canceled, as of
      each day's latest pull (decision 0019). Not unique: sum per line before
      dividing.
    data_tests:
      - not_null_columns:
          arguments:
            columns: [service_date, route_id, is_peak, ingested_at]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: route_id
        description: The line's GTFS route (e.g. CR-Newburyport).
      - name: route_part_name
        description: The line or branch as published (e.g. Rockport Line).
      - name: is_peak
        description: True for the peak period, false for off-peak.
      - name: trains_measured
        description: Trains measured for on-time performance.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: trains_on_time
        description: Measured trains on time.
      - name: trains_canceled
        description: Trains canceled.
      - name: ingested_at
        description: The load the service day's rows came from (UTC).
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_customer_satisfaction__base
    description: >
      One row per survey × question — the MBTA's monthly rider survey, as of
      the latest pull, seven answers per question from most negative to most
      positive (decision 0019).
    data_tests:
      - unique_combination:
          arguments:
            columns: [survey_month, question]
      - not_null_columns:
          arguments:
            columns: [survey_month, question]
    columns:
      - name: survey_month
        description: Survey month, as its first day.
      - name: question
        description: The question as asked.
      - name: respondents
        description: Respondents to the question.
      - name: answer_1
        description: The most negative answer; gold.transit_rider_satisfaction counts on this order.
        data_tests:
          - accepted_values:
              arguments:
                values: [Extremely Dissatisfied, Strongly Disagree]
      - name: answer_1_share
        description: Share of respondents giving answer 1, from 0 to 1.
      - name: answer_2
        description: Answer 2 of 7.
      - name: answer_2_share
        description: Share giving answer 2.
      - name: answer_3
        description: Answer 3 of 7.
      - name: answer_3_share
        description: Share giving answer 3.
      - name: answer_4
        description: The neutral answer.
        data_tests:
          - accepted_values:
              arguments:
                values: [Neutral, Neither Agree nor Disagree]
      - name: answer_4_share
        description: Share giving answer 4.
      - name: answer_5
        description: Answer 5 of 7.
      - name: answer_5_share
        description: Share giving answer 5.
      - name: answer_6
        description: Answer 6 of 7.
      - name: answer_6_share
        description: Share giving answer 6.
      - name: answer_7
        description: The most positive answer.
        data_tests:
          - accepted_values:
              arguments:
                values: [Extremely Satisfied, Strongly Agree]
      - name: answer_7_share
        description: Share giving answer 7.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  # ── Steps ───────────────────────────────────────────────────────────────────

  - name: mbta_alerts__by_route
    description: >
      One row per alert × route seen since full-JSON capture began
      (2026-10-24): mbta_alerts__base split by the rail routes its entities
      name, with its typed columns (enum values as the API sends them) and
      first/last seen. Other alerts come from LAMP (lamp_alerts__by_route).
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
      - not_null_columns:
          arguments:
            columns: [alert_id, route_id, first_seen_at, last_seen_at]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: posted_start_at
        description: Start the MBTA posted (UTC); NULL when unset (the API's epoch placeholder).
      - name: posted_end_at
        description: End the MBTA posted (UTC), an estimate usually on the hour; NULL when unset.
      - name: active_periods
        description: "{{ doc('active_periods') }}"
      - name: alert_duration_certainty
        description: MBTA enum (KNOWN, ESTIMATED, UNKNOWN).
      - name: alert_header
        description: "{{ doc('alert_header') }}"
      - name: alert_description
        description: "{{ doc('alert_description') }}"
      - name: alert_cause
        description: MBTA cause enum (e.g. SIGNAL_PROBLEM).
      - name: alert_effect
        description: MBTA effect enum (e.g. DELAY, SHUTTLE).
      - name: alert_severity
        description: "{{ doc('alert_severity') }}"
      - name: alert_created_at
        description: "{{ doc('alert_created_at') }}"
      - name: alert_updated_at
        description: "{{ doc('alert_updated_at') }}"
      - name: first_seen_at
        description: "{{ doc('first_seen_at') }}"
      - name: last_seen_at
        description: "{{ doc('last_seen_at') }}"
      - name: alert_closed_at
        description: >
          When the MBTA closed the alert (UTC), if a snapshot caught it after
          closing; alerts stay in the feed only a few minutes after.

  - name: lamp_alerts__by_route
    description: >
      One row per LAMP alert × rail route: lamp_alerts__base split by the rail
      routes its entities name, with mbta_alerts__by_route's columns.
      mbta_alerts__resolved takes the alerts that ended before
      full-JSON capture from here (decision 0016).
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
      - not_null_columns:
          arguments:
            columns: [alert_id, route_id]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: alert_closed_at
        description: "{{ doc('alert_closed_at') }}"

  - name: mbta_alerts__resolved
    description: >
      One row per service-affecting alert × route, with when it really started
      and ended and whether it's still in the feed (see model header): alerts
      seen since full-JSON capture from the snapshots, earlier ones from LAMP.
      Effects in var non_service_alert_effects are excluded. Enums as in
      mbta_alerts__by_route.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
      - not_null_columns:
          arguments:
            columns: [is_in_feed, alert_start_at, ingested_at]
    columns:
      - name: is_in_feed
        description: "{{ doc('alert_is_in_feed') }}"
      - name: left_feed_at
        description: >
          When the alert left the feed (UTC): midway between the last run that
          saw it and the next, at most 30 minutes after last seen. Meaningless
          while is_in_feed; NULL for LAMP alerts, which
          never were in a snapshot.
      - name: alert_closed_at
        description: >
          {{ doc('alert_closed_at') }} Always set for LAMP alerts; for snapshot
          alerts, only when a run caught the alert after it closed.
      - name: alert_start_at
        description: "{{ doc('alert_start_at') }}"
      - name: alert_end_at
        description: "{{ doc('alert_end_at') }}"
      - name: active_periods
        description: >
          {{ doc('active_periods') }} alert_start_at and alert_end_at resolve
          the first; mbta_alerts__by_period resolves each.
      - name: ingested_at
        description: >
          When the run that wrote this version started (UTC): the last-seen
          snapshot, or the LAMP load.
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [ingest-mbta-alerts, ingest-lamp-alerts]

  - name: mbta_alerts__by_period
    description: >
      One row per service-affecting alert × route × active period that took
      effect, each period cut off where the alert stopped (its close, or
      leaving the feed); an alert that posted none is its resolved span. When
      alerts were in force by the clock, beside the alert × route grain (see
      model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id, period_start_at]
      - not_null_columns:
          arguments:
            columns: [alert_id, route_id, period_start_at]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: period_start_at
        description: When the period began (UTC).
      - name: period_end_at
        description: >
          When it ended (UTC): its posted end or when the alert stopped,
          whichever came first. NULL while in force with neither.

  - name: mbta_alerts__grouped
    description: >
      One row per service-affecting alert × route, with the incident it belongs
      to and human-readable enums — what gold reads (see model header). Built
      on mbta_alerts__resolved.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
      - not_null_columns:
          arguments:
            columns: [alert_id, route_id, incident_id, alert_start_at]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('mbta_routes__base')
                field: route_id
      - name: incident_id
        description: "{{ doc('incident_id') }}"
      - name: alert_header
        description: "{{ doc('alert_header') }}"
      - name: alert_description
        description: "{{ doc('alert_description') }}"
      - name: alert_cause
        description: Cause, title-cased from the MBTA enum (e.g. "Signal Problem").
      - name: alert_effect
        description: Effect, title-cased from the MBTA enum (e.g. "Delay", "Shuttle").
      - name: alert_severity
        description: "{{ doc('alert_severity') }}"
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: alert_duration_certainty
        description: Whether MBTA considers the end time Known, Estimated, or Unknown.
      - name: alert_start_at
        description: "{{ doc('alert_start_at') }}"
      - name: alert_end_at
        description: "{{ doc('alert_end_at') }}"
      - name: alert_start_date
        description: Eastern date of alert_start_at.
      - name: alert_end_date
        description: Eastern date of alert_end_at; NULL while ongoing.
      - name: alert_duration_minutes
        description: >
          Minutes from start to end, or to now for ongoing alerts. NULL for an
          alert that hasn't started yet and has no posted end.
        data_tests:
          # The API occasionally publishes an end before the start.
          - accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: alert_location_key
        description: >
          Station/area named in the header after at/near/between/from,
          lower-cased with punctuation removed (e.g. "jfkumass"); NULL if none.
          Used to group alerts into incidents.
      - name: alert_created_at
        description: "{{ doc('alert_created_at') }}"
      - name: alert_updated_at
        description: "{{ doc('alert_updated_at') }}"
      - name: is_in_feed
        description: "{{ doc('alert_is_in_feed') }}"
      - name: first_seen_at
        description: "{{ doc('first_seen_at') }} NULL for LAMP alerts."
      - name: last_seen_at
        description: >
          Last ingest run that included this alert (UTC); equals ingested_at.
          NULL for LAMP alerts.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"


  - name: mbta_alerts__by_station
    description: >
      One row per alert × rail route × station the alert names. A bridge table
      beside mbta_alerts__grouped (which stays alert × route): platforms roll up
      to their station. Alerts naming no stops (most delays) have no rows.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id, station_id]
      - not_null_columns:
          arguments:
            columns: [alert_id, route_id, station_id, is_both_directions]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: station_id
        description: "{{ doc('station_id') }}"
        data_tests:
          # A stop the stops reference doesn't know keeps its own ID; flag it,
          # since the next weekly stops run usually fills it in.
          - relationships:
              arguments:
                to: ref('mbta_stops__base')
                field: station_id
              config:
                severity: warn
      - name: is_both_directions
        description: True when the alert affects the station in both directions (or names no direction).
      - name: direction_id
        description: >
          The one direction affected (0 or 1, indexing the route's
          route_destinations); NULL when both are.
