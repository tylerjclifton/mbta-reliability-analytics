version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Gold — cross-source tables served to the dashboard (rebuilt every run)
#
# Column meanings match their silver sources
# (models/silver/_silver__models.yml). Tests here guard the joins: the grain
# still holds after joining, and every ridership day found its weather.
# ══════════════════════════════════════════════════════════════════════════════

models:
  - name: rail_incidents
    description: >
      One row per incident × route — the alerts the MBTA posted for one event,
      collapsed. The dashboard's alert counts, durations, and cause/effect
      breakdowns all read this table.
    data_tests:
      - unique_combination:
          arguments:
            columns: [incident_id, route_id]
    columns:
      - name: incident_id
        description: "{{ doc('incident_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests: [not_null]
      - name: incident_cause
        description: "{{ doc('incident_cause') }}"
      - name: incident_effect
        description: "{{ doc('incident_effect') }}"
      - name: incident_header
        description: "{{ doc('incident_header') }}"
      - name: incident_description
        description: Long text of the incident's most recent alert.
      - name: incident_severity
        description: Highest severity among the incident's alerts (0–10).
      - name: incident_start_at
        description: "{{ doc('incident_start_at') }}"
        data_tests: [not_null]
      - name: incident_end_at
        description: "{{ doc('incident_end_at') }}"
      - name: incident_duration_minutes
        description: >
          Minutes from start to end, or to now while ongoing. NULL for an
          upcoming incident with no posted end.
      - name: alert_count
        description: Number of MBTA alerts posted for this incident.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1
      - name: is_in_feed
        description: "{{ doc('incident_is_in_feed') }}"
      - name: stations_affected
        description: >
          Distinct stations the incident's alerts name on this route. NULL when
          none of its alerts' full JSON was captured (before
          2026-10-24), so unknown; 0 when they were but named no
          stations, as with most line-wide delays.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"

  - name: rail_incident_stations
    description: >
      One row per incident × route × station the incident's alerts name, with
      the station's coordinates and the incident's details — the dashboard's
      map. Covers incidents since full-JSON capture began (2026-10-24) whose
      alerts name stations.
    data_tests:
      - unique_combination:
          arguments:
            columns: [incident_id, route_id, station_id]
    columns:
      - name: incident_id
        description: "{{ doc('incident_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [not_null]
      - name: station_id
        description: "{{ doc('station_id') }}"
        data_tests: [not_null]
      - name: route_name
        description: "{{ doc('route_name') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests: [not_null]
      - name: station_name
        description: "{{ doc('station_name') }}"
        data_tests:
          # NULL only for a stop the stops reference doesn't know yet.
          - not_null:
              config:
                severity: warn
      - name: station_latitude
        description: "{{ doc('station_latitude') }}"
      - name: station_longitude
        description: "{{ doc('station_longitude') }}"
      - name: affects_both_directions
        description: True when service at the station is affected both ways.
      - name: direction_destination
        description: >
          When one direction is affected, the terminal it runs toward (e.g.
          "Boston College" for outbound C branch trains); NULL when both are.
      - name: incident_cause
        description: "{{ doc('incident_cause') }}"
      - name: incident_effect
        description: "{{ doc('incident_effect') }}"
      - name: incident_header
        description: "{{ doc('incident_header') }}"
      - name: incident_start_at
        description: "{{ doc('incident_start_at') }}"
      - name: incident_end_at
        description: "{{ doc('incident_end_at') }}"
      - name: is_in_feed
        description: "{{ doc('incident_is_in_feed') }}"
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"

  - name: rail_shapes
    description: >
      One row per canonical shape × route: the official path of each rail route
      and the line it belongs to, for drawing the lines on the map.
    data_tests:
      - unique_combination:
          arguments:
            columns: [shape_id, route_id]
    columns:
      - name: shape_id
        description: "{{ doc('shape_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [not_null]
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests: [not_null]
      - name: shape_polyline
        description: "{{ doc('shape_polyline') }}"
        data_tests: [not_null]
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"

  - name: rail_stations
    description: >
      One row per station × line: every rail station's name and coordinates,
      once per line it serves — the map's backdrop.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, line_name]
    columns:
      - name: station_id
        description: "{{ doc('station_id') }}"
        data_tests: [not_null]
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests: [not_null]
      - name: station_name
        description: "{{ doc('station_name') }}"
        data_tests: [not_null]
      - name: station_latitude
        description: "{{ doc('station_latitude') }}"
        data_tests: [not_null]
      - name: station_longitude
        description: "{{ doc('station_longitude') }}"
        data_tests: [not_null]
      - name: is_wheelchair_accessible
        description: "{{ doc('is_wheelchair_accessible') }}"
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"

  - name: rail_ridership
    description: >
      One row per service date × line — gated entries, the number of incidents
      active on the line that day, its most severe alert effect and whether it
      was a calm day, and that day's weather at Boston Logan.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, line_name]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
      - name: line_name
        description: "{{ doc('line_name') }}"
      - name: gated_entries
        description: "{{ doc('gated_entries') }}"
      - name: active_incident_count
        description: Distinct incidents on any of the line's routes active at some point that service date.
      - name: most_severe_effect
        description: >
          The most severe effect among incidents active on the line that day —
          Shuttle, then Suspension, then Delay — or NULL if none of those.
          Other effects (station closures, service changes) aren't ranked; see
          is_calm_day for whether the day was undisrupted.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Shuttle', 'Suspension', 'Delay']
      - name: is_calm_day
        description: >
          True when no incident was active on the line that day other than
          station closures, which close one stop (often for months) rather than
          disrupt the line. Any other effect makes the day not calm. Only
          meaningful once alert tracking had begun — earlier days read as calm
          because no alerts were recorded.
        data_tests: [not_null]
      - name: avg_temperature_f
        description: "{{ doc('avg_temperature_f') }}"
        data_tests:
          # Every ridership day should have weather — NOAA runs ahead of the
          # MBTA's ridership publishing. A gap means the weather ingest broke.
          - not_null:
              config:
                severity: warn
      - name: precipitation_in
        description: "{{ doc('precipitation_in') }}"
      - name: snowfall_in
        description: "{{ doc('snowfall_in') }}"
      - name: ridership_ingested_at
        description: When the ridership version used was ingested (UTC).
      - name: weather_ingested_at
        description: When the weather version used was ingested (UTC).
