version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Silver — every model is <bronze table>__<step>, so each source's models
# sort together and the name says what the model is
#
#   __base           the cleaned copy (mbta_alerts__base, mbta_stops__base, …):
#                    the latest version of each record, renamed and typed, no
#                    business rules. Views, except the two incremental alert
#                    tables (see their headers).
#   __<step>         one business rule, named for what it produces
#                    (mbta_alerts__resolved, mbta_alerts__incidents), built
#                    from __base models or earlier steps. Views.
#
# Tests run in `dbt build` before gold is rebuilt; an error-severity failure
# skips everything downstream, so bad data never reaches the dashboard.
#   unique_combination / unique + not_null  → the model's grain holds
#   accepted_values / relationships         → keys join cleanly across sources
#   accepted_range                          → values are physically plausible
# ══════════════════════════════════════════════════════════════════════════════

models:

  # ── Cleaned copies ──────────────────────────────────────────────────────────

  - name: mbta_alerts__base
    description: >
      One row per alert × route ever seen: the latest snapshot, renamed to
      project conventions (enum values as the API sends them), plus first/last
      seen. Incremental table, so the transform reads only new snapshots
      instead of re-reading all of bronze (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [not_null]
      - name: posted_start_at
        description: Start the MBTA posted (UTC); NULL when unset (the API's epoch placeholder).
      - name: posted_end_at
        description: End the MBTA posted (UTC), an estimate usually on the hour; NULL when unset.
      - name: alert_duration_certainty
        description: MBTA enum (KNOWN, ESTIMATED, UNKNOWN).
      - name: alert_header
        description: Short alert text.
      - name: alert_description
        description: Long alert text.
      - name: alert_cause
        description: MBTA cause enum (e.g. SIGNAL_PROBLEM).
      - name: alert_effect
        description: MBTA effect enum (e.g. DELAY, SHUTTLE).
      - name: alert_severity
        description: MBTA severity, 0 (least) to 10 (most).
      - name: alert_created_at
        description: When MBTA created the alert (UTC).
      - name: alert_updated_at
        description: When MBTA last updated the alert (UTC).
      - name: first_seen_at
        description: First ingest run that included this alert (UTC).
        data_tests: [not_null]
      - name: last_seen_at
        description: Latest ingest run that included this alert (UTC).
        data_tests: [not_null]

  - name: mbta_alerts_raw__base
    description: >
      One row per alert ever captured raw: its latest full JSON plus first/last
      seen. Incremental table like mbta_alerts__base (see model header). Raw capture
      began 2026-10-24.
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [unique, not_null]
      - name: alert_json
        description: The alert's latest JSON:API object, exactly as the API returned it.
        data_tests: [not_null]
      - name: first_seen_at
        description: First ingest run that included this alert (UTC).
        data_tests: [not_null]
      - name: last_seen_at
        description: Latest ingest run that included this alert (UTC).
        data_tests: [not_null]

  - name: mbta_routes__base
    description: One row per rail route — the latest snapshot, plus the line it belongs to.
    columns:
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [unique, not_null]
      - name: route_name
        description: Route display name (e.g. "Green Line B").
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                # Anchor reused by mbta_ridership__base.line_name below
                values: &rail_lines ['Red Line', 'Orange Line', 'Blue Line', 'Green Line']
      - name: route_description
        description: MBTA route description (e.g. "Rapid Transit").
      - name: route_type
        description: Light Rail or Heavy Rail.
      - name: route_color
        description: Route hex color without the leading #.
      - name: route_destinations
        description: Terminal stations, as a stringified list.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_stops__base
    description: >
      One row per stop × route: every rail station and the stops inside it
      (platforms, entrances, nodes), each mapped to its station. A station and
      its child stops repeat for each route serving it.
    data_tests:
      - unique_combination:
          arguments:
            columns: [stop_id, route_id]
    columns:
      - name: stop_id
        description: MBTA stop ID — a station (place-…) or a stop inside one (platform, entrance, node).
        data_tests: [not_null]
      - name: route_id
        description: "Route whose stations were requested. {{ doc('route_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mbta_routes__base')
                field: route_id
      - name: station_id
        description: "{{ doc('station_id') }} A station's own row has station_id = stop_id."
        data_tests: [not_null]
      - name: station_name
        description: Station name (child stops carry their station's name).
      - name: stop_type
        description: Platform, Station, Entrance, Node, or Boarding Area (GTFS location_type).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Platform', 'Station', 'Entrance', 'Node', 'Boarding Area']
      - name: stop_platform_name
        description: A platform's direction or destination (e.g. "Boston College"); NULL otherwise.
      - name: stop_latitude
        description: WGS84 latitude.
        data_tests:
          # Greater Boston; a value outside means a bad coordinate
          - accepted_range:
              arguments:
                min_value: 42.0
                max_value: 42.7
      - name: stop_longitude
        description: WGS84 longitude.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -71.4
                max_value: -70.8
      - name: stop_municipality
        description: City or town.
      - name: is_wheelchair_accessible
        description: True/False per the MBTA; NULL when it has no information.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: mbta_ridership__base
    description: One row per service date × line — the latest published gated-entry count.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, line_name]
    columns:
      - name: service_date
        description: "{{ doc('service_date') }}"
        data_tests: [not_null]
      - name: line_name
        description: "{{ doc('line_name') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *rail_lines
      - name: gated_entries
        description: Fare-gate entries across all of the line's stations that day (fractional at shared stations).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  - name: noaa_weather__base
    description: One row per observation date — quality-checked daily weather at Boston Logan, in US units.
    columns:
      - name: observation_date
        description: "{{ doc('observation_date') }}"
        data_tests: [unique, not_null]
      - name: station_id
        description: GHCN station ID (USW00014739 = Boston Logan International Airport).
      - name: avg_temperature_f
        description: Daily mean temperature, °F, as (max + min) / 2.
      - name: max_temperature_f
        description: Daily maximum temperature, °F.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -40
                max_value: 120
      - name: min_temperature_f
        description: Daily minimum temperature, °F.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -40
                max_value: 120
      - name: precipitation_in
        description: Total precipitation, inches, as liquid equivalent (melted snow included).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: snowfall_in
        description: New snowfall depth, inches, before melting.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"

  # ── Logic steps ─────────────────────────────────────────────────────────────

  - name: mbta_alerts__resolved
    description: >
      One row per service-affecting alert × route, with when it really started
      and ended and whether it's still in the feed (see model header). Effects
      in var non_service_alert_effects are excluded. Enums as in mbta_alerts__base.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
    columns:
      - name: is_in_feed
        description: True when the alert was in the latest ingest run, i.e. still listed by the API.
        data_tests: [not_null]
      - name: left_feed_at
        description: >
          When the alert left the feed (UTC): midway between the last run that
          saw it and the next, at most 30 minutes after last seen. Meaningless
          while is_in_feed.
      - name: alert_start_at
        description: When the alert took effect (UTC). Posted start, else when MBTA created the alert.
        data_tests: [not_null]
      - name: alert_end_at
        description: >
          Whichever came first: the posted end, or leaving the feed. NULL while
          still in the feed with no posted end.

  - name: mbta_alerts__incidents
    description: >
      One row per service-affecting alert × route, with the incident it belongs
      to and human-readable enums — what gold reads (see model header). Built
      on mbta_alerts__resolved.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mbta_routes__base')
                field: route_id
      - name: incident_id
        description: "{{ doc('incident_id') }}"
        data_tests: [not_null]
      - name: alert_header
        description: Short alert text.
      - name: alert_description
        description: Long alert text.
      - name: alert_cause
        description: Cause, title-cased from the MBTA enum (e.g. "Signal Problem").
      - name: alert_effect
        description: Effect, title-cased from the MBTA enum (e.g. "Delay", "Shuttle").
      - name: alert_severity
        description: MBTA severity, 0 (least) to 10 (most).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 10
      - name: alert_duration_certainty
        description: Whether MBTA considers the end time Known, Estimated, or Unknown.
      - name: alert_start_at
        description: When the alert took effect (UTC). Posted start, else when MBTA created the alert.
        data_tests: [not_null]
      - name: alert_end_at
        description: >
          When the alert ended (UTC): whichever came first — the end time the
          MBTA posted, or when the alert left the feed (midway between the last
          run that saw it and the next run, at most 30 minutes after last seen).
          NULL while still in the feed with no posted end.
      - name: alert_start_date
        description: Eastern date of alert_start_at.
      - name: alert_end_date
        description: Eastern date of alert_end_at; NULL while ongoing.
      - name: alert_duration_minutes
        description: Minutes from start to end, or to now for ongoing alerts.
        data_tests:
          # The API occasionally publishes an end before the start
          - accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: alert_location_key
        description: >
          Station/area named in the header after at/near/between/from,
          lower-cased with punctuation removed (e.g. "jfkumass"); NULL if none.
          Used to group alerts into incidents.
      - name: alert_created_at
        description: When MBTA created the alert (UTC).
      - name: alert_updated_at
        description: When MBTA last updated the alert (UTC).
      - name: is_in_feed
        description: True when the alert was in the latest ingest run, i.e. still listed by the API.
      - name: first_seen_at
        description: First ingest run that included this alert (UTC).
      - name: last_seen_at
        description: Last ingest run that included this alert (UTC). Equals ingested_at.
      - name: ingested_at
        description: "{{ doc('ingested_at') }}"
      - name: ingested_by
        description: "{{ doc('ingested_by') }}"


  - name: mbta_alerts__stations
    description: >
      One row per alert × rail route × station the alert names. A bridge table
      beside mbta_alerts__incidents (which stays alert × route): platforms roll up to
      their station. Alerts naming no stops (most delays) have no rows.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, route_id, station_id]
    columns:
      - name: alert_id
        description: "{{ doc('alert_id') }}"
        data_tests: [not_null]
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_tests: [not_null]
      - name: station_id
        description: "{{ doc('station_id') }}"
        data_tests:
          - not_null
          # A stop the stops reference doesn't know keeps its own ID; flag it,
          # since the next weekly stops run usually fills it in
          - relationships:
              arguments:
                to: ref('mbta_stops__base')
                field: station_id
              config:
                severity: warn
      - name: affects_both_directions
        description: True when the alert affects the station in both directions (or names no direction).
        data_tests: [not_null]
      - name: direction_id
        description: >
          The one direction affected (0 or 1, indexing the route's
          route_destinations); NULL when both are.

