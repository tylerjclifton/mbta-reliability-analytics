version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Bronze — append-only raw history
#
# Tables are created by Terraform (infra/bigquery.tf) and written only by ingest
# jobs (ingest/<source>-<entity>/). dbt reads them as sources and never writes
# to them. Each ingest run appends a new version of every record it saw; silver
# keeps the latest version (macros/keep_latest_version.sql).
#
# Freshness: `dbt source freshness` (run after `dbt build` in the transform
# job) fails the run when a table hasn't been written for longer than its ingest
# schedule allows — i.e. when an ingest job has stopped working.
# ══════════════════════════════════════════════════════════════════════════════

sources:
  - name: bronze
    schema: bronze
    config:
      loaded_at_field: ingested_at

    tables:
      - name: mbta_alerts_legacy
        description: >
          Frozen: 15-minute snapshots of the MBTA alerts API (rail routes only)
          as the old ingest shaped them, 2026-06-07 to 2026-10-24. Never written
          since the raw cutover; never delete (decision 0002). Silver reads it
          only for history before var alerts_raw_capture_start.
          Grain: alert × route × ingest run.
        # No freshness check: nothing writes it anymore

      - name: mbta_alerts
        description: >
          15-minute snapshots of the MBTA alerts API (rail routes only), each
          alert's full JSON as the API returned it, including the stops it
          affects. The live alerts table since 2026-10-24. Grain: alert × ingest run.
        config:
          freshness:
            # Every 15 minutes; a run with no rail alerts writes nothing, so allow slack
            warn_after: {count: 1, period: hour}
            error_after: {count: 3, period: hour}

      - name: mbta_stops
        description: >
          Snapshots of the MBTA stops API: each rail route's stations plus the
          platforms, entrances, and nodes inside them.
          Grain: stop × route × ingest run.
        config:
          freshness:
            # Weekly job
            warn_after: {count: 8, period: day}
            error_after: {count: 15, period: day}

      - name: mbta_routes
        description: >
          Snapshots of the MBTA routes API (rail routes only).
          Grain: route × ingest run.
        config:
          freshness:
            # Yearly job
            error_after: {count: 400, period: day}

      - name: mbta_ridership
        description: >
          Gated station entries per day and line from MBTA ArcGIS open data,
          full published history every run. Grain: service date × line × ingest run.
        config:
          freshness:
            # Weekly job
            warn_after: {count: 8, period: day}
            error_after: {count: 15, period: day}

      - name: noaa_weather
        description: >
          NOAA GHCN-Daily values for Boston Logan in source units (tenths of °C,
          tenths of mm, mm) with QC flags. Grain: observation date × ingest run.
        config:
          freshness:
            # Daily job
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
