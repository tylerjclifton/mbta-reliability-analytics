version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Silver unit tests — the alert rules, checked on made-up rows
#
# The data tests in _silver__models.yml check that real data is sane (grain,
# joins, ranges); they can't tell whether a rule is right. These feed a model a
# few hand-written rows with known answers and compare its output, so a change
# that breaks a rule fails the build instead of quietly shifting the
# dashboard's incident counts and durations.
#
#   lamp_alerts__base      posted dates from the latest version that has any
#   mbta_alerts__resolved  end time (posted end vs leaving the feed, the
#                          30-minute midpoint cap; LAMP's close), start
#                          fallback, which alerts are dropped, which source an
#                          alert comes from
#   mbta_alerts__by_period each period cut off where its alert stopped
#   mbta_alerts__grouped   2- and 6-hour follow-up windows (and their edges),
#                          what keeps alerts apart (route, cause, location)
#
# They run in `dbt build` before the model they test; a failure skips the model
# and everything downstream, like a data test. They read no tables (dbt only
# looks up the inputs' column types), so they cost nothing to run. Only the
# columns a test lists are set or compared; the rest are NULL / ignored.
#
# dbt's unit test docs: https://docs.getdbt.com/docs/build/unit-tests
# ══════════════════════════════════════════════════════════════════════════════

unit_tests:

  # ── lamp_alerts__base ───────────────────────────────────────────────────────
  # LAMP's times are epoch seconds: 1748779200 = 2025-06-01 12:00 UTC. Built
  # as a first build (no table to continue from), so nothing is read.

  - name: lamp_base_dates_survive_the_closing_version
    description: >
      The version LAMP adds when the MBTA closes an alert has no active period,
      so the posted dates come from the latest version that has one (here an
      extension), and the close from the closing version. An alert that never
      posted a period has no posted dates.
    model: lamp_alerts__base
    overrides:
      macros:
        is_incremental: false
        last_processed_snapshot: ''
    given:
      - input: source('bronze', 'lamp_alerts')
        rows:
          # Posted 06-01 12:00 for 06-02 05:00 to 06-03 05:00…
          - {id: 1, effect_detail: SHUTTLE, informed_entity_route_id: Red, created_timestamp: 1748779200,
             last_modified_timestamp: 1748779200, active_period_start_timestamp: 1748840400,
             active_period_end_timestamp: 1748926800, ingested_at: '2025-06-10 12:00:00'}
          # …extended at 18:00 to 06-04 05:00 (the period repeats per entity)…
          - {id: 1, effect_detail: SHUTTLE, informed_entity_route_id: Red, created_timestamp: 1748779200,
             last_modified_timestamp: 1748800800, active_period_start_timestamp: 1748840400,
             active_period_end_timestamp: 1749013200, ingested_at: '2025-06-10 12:00:00'}
          - {id: 1, effect_detail: SHUTTLE, informed_entity_route_id: Red, informed_entity_stop_id: '70061',
             created_timestamp: 1748779200, last_modified_timestamp: 1748800800,
             active_period_start_timestamp: 1748840400, active_period_end_timestamp: 1749013200,
             ingested_at: '2025-06-10 12:00:00'}
          # …and closed early, at 06-04 03:00, with no period.
          - {id: 1, effect_detail: SHUTTLE, informed_entity_route_id: Red, created_timestamp: 1748779200,
             last_modified_timestamp: 1749006000, closed_timestamp: 1749006000, ingested_at: '2025-06-10 12:00:00'}
          # Never posted a period; closed at 15:00.
          - {id: 2, effect_detail: DELAY, informed_entity_route_id: Red, created_timestamp: 1748779200,
             last_modified_timestamp: 1748790000, closed_timestamp: 1748790000, ingested_at: '2025-06-10 12:00:00'}
      - input: ref('mbta_routes__base')
        rows:
          - {route_id: Red}
    expect:
      rows:
        - {alert_id: '1', posted_start_at: '2025-06-02 05:00:00', posted_end_at: '2025-06-04 05:00:00',
           alert_created_at: '2025-06-01 12:00:00', alert_closed_at: '2025-06-04 03:00:00'}
        - {alert_id: '2', posted_start_at: null, posted_end_at: null,
           alert_created_at: '2025-06-01 12:00:00', alert_closed_at: '2025-06-01 15:00:00'}

  # ── mbta_alerts__resolved ───────────────────────────────────────────────────
  # Every test uses the same ingest runs: 06:00, then (after an outage) 10:00,
  # 10:15, 10:30 — the latest run, so "still in the feed". Full-JSON capture
  # starts that day at midnight (var alerts_raw_capture_start), and LAMP history
  # on 2025-01-01 (var lamp_alerts_start).

  - name: resolved_end_time_rules
    description: >
      Still in the feed → the posted end (NULL if none). Left the feed →
      whichever came first: the posted end, or midway to the next run, capped
      at 30 minutes after last seen. Caught closed → the close, or the posted
      end if earlier, in or out of the feed.
    model: mbta_alerts__resolved
    overrides: &resolved_vars
      vars:
        alerts_raw_capture_start: '2026-01-05 00:00:00'
        lamp_alerts_start: '2025-01-01'
    given:
      - input: source('bronze', 'mbta_alerts')
        rows: &runs
          - {ingested_at: '2026-01-05 06:00:05'}
          - {ingested_at: '2026-01-05 10:00:05'}
          - {ingested_at: '2026-01-05 10:15:05'}
          - {ingested_at: '2026-01-05 10:30:05'}
      - input: ref('lamp_alerts__by_route')
        rows: &no_lamp []
      - input: ref('mbta_alerts__by_route')
        rows:
          # In the latest run, no posted end → ongoing.
          - {alert_id: in_feed_ongoing, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: null, last_seen_at: '2026-01-05 10:30:05'}
          # In the latest run → its posted end, even though that's still ahead.
          - {alert_id: in_feed_posted_end, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: '2026-01-05 12:00:00', last_seen_at: '2026-01-05 10:30:05'}
          # Last seen 10:00:05, next run 15 minutes
          # later → left 7.5 minutes after.
          - {alert_id: left_feed, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: null, last_seen_at: '2026-01-05 10:00:05'}
          # Posted end (10:05) came before leaving (10:07:35) → the posted end.
          - {alert_id: posted_end_first, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: '2026-01-05 10:05:00', last_seen_at: '2026-01-05 10:00:05'}
          # Left (10:22:35) well before its posted end (18:00) → leaving.
          - {alert_id: left_before_posted_end, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: '2026-01-05 18:00:00', last_seen_at: '2026-01-05 10:15:05'}
          # Next run 4 hours later → the midpoint would
          # be 08:00; capped at 06:30.
          - {alert_id: midpoint_capped, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 05:00:00', posted_end_at: null, last_seen_at: '2026-01-05 06:00:05'}
          # Caught closed in the latest run, still
          # lingering in the feed → the close.
          - {alert_id: closed_in_feed, route_id: Red, alert_effect: DELAY, posted_start_at: '2026-01-05 09:00:00',
             posted_end_at: null, alert_closed_at: '2026-01-05 10:25:00', last_seen_at: '2026-01-05 10:30:05'}
          # Caught closed (10:03) before leaving the feed (10:07:35) →
          # the close.
          - {alert_id: closed_then_left, route_id: Red, alert_effect: DELAY, posted_start_at: '2026-01-05 09:00:00',
             posted_end_at: '2026-01-05 12:00:00', alert_closed_at: '2026-01-05 10:03:00',
             last_seen_at: '2026-01-05 10:00:05'}
    expect:
      rows:
        - {alert_id: in_feed_ongoing,        is_in_feed: true,  alert_end_at: null}
        - {alert_id: in_feed_posted_end,     is_in_feed: true,  alert_end_at: '2026-01-05 12:00:00'}
        - {alert_id: left_feed,              is_in_feed: false, alert_end_at: '2026-01-05 10:07:35'}
        - {alert_id: posted_end_first,       is_in_feed: false, alert_end_at: '2026-01-05 10:05:00'}
        - {alert_id: left_before_posted_end, is_in_feed: false, alert_end_at: '2026-01-05 10:22:35'}
        - {alert_id: midpoint_capped,        is_in_feed: false, alert_end_at: '2026-01-05 06:30:05'}
        - {alert_id: closed_in_feed,         is_in_feed: true,  alert_end_at: '2026-01-05 10:25:00'}
        - {alert_id: closed_then_left,       is_in_feed: false, alert_end_at: '2026-01-05 10:03:00'}

  - name: resolved_ignores_a_run_landing_mid_transform
    description: >
      A run the snapshots table hasn't processed yet (it landed while the
      transform ran) doesn't count: alerts seen in the newest processed run are
      still in the feed, and an earlier one left before the next processed run.
    model: mbta_alerts__resolved
    overrides: *resolved_vars
    given:
      - input: source('bronze', 'mbta_alerts')
        rows:
          - {ingested_at: '2026-01-05 10:15:05'}
          - {ingested_at: '2026-01-05 10:30:05'}
          - {ingested_at: '2026-01-05 10:45:05'}
      - input: ref('lamp_alerts__by_route')
        rows: *no_lamp
      - input: ref('mbta_alerts__by_route')
        rows:
          - {alert_id: newest_processed, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: null, last_seen_at: '2026-01-05 10:30:05'}
          - {alert_id: left_earlier, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', posted_end_at: null, last_seen_at: '2026-01-05 10:15:05'}
    expect:
      rows:
        - {alert_id: newest_processed, is_in_feed: true,  alert_end_at: null}
        - {alert_id: left_earlier,     is_in_feed: false, alert_end_at: '2026-01-05 10:22:35'}

  - name: resolved_start_falls_back_to_created
    description: An alert with no posted start starts when the MBTA created it.
    model: mbta_alerts__resolved
    overrides: *resolved_vars
    given:
      - input: source('bronze', 'mbta_alerts')
        rows: *runs
      - input: ref('lamp_alerts__by_route')
        rows: *no_lamp
      - input: ref('mbta_alerts__by_route')
        rows:
          - {alert_id: posted_start, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', alert_created_at: '2026-01-05 08:50:00', last_seen_at: '2026-01-05 10:30:05'}
          - {alert_id: no_posted_start, route_id: Red, alert_effect: DELAY,
             posted_start_at: null, alert_created_at: '2026-01-05 09:30:00', last_seen_at: '2026-01-05 10:30:05'}
    expect:
      rows:
        - {alert_id: posted_start,    alert_start_at: '2026-01-05 09:00:00'}
        - {alert_id: no_posted_start, alert_start_at: '2026-01-05 09:30:00'}

  - name: resolved_drops_non_service_and_never_started
    description: >
      Effects in var non_service_alert_effects are dropped. An announced alert
      that left the feed before its start never took effect and is dropped;
      one still in the feed is kept.
    model: mbta_alerts__resolved
    overrides: *resolved_vars
    given:
      - input: source('bronze', 'mbta_alerts')
        rows: *runs
      - input: ref('lamp_alerts__by_route')
        rows: *no_lamp
      - input: ref('mbta_alerts__by_route')
        rows:
          - {alert_id: service_alert, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', last_seen_at: '2026-01-05 10:30:05'}
          - {alert_id: escalator_closure, route_id: Red, alert_effect: ESCALATOR_CLOSURE,
             posted_start_at: '2026-01-05 09:00:00', last_seen_at: '2026-01-05 10:30:05'}
          # Announced for tomorrow, gone from the feed
          # today → canceled or re-posted.
          - {alert_id: announced_then_gone, route_id: Red, alert_effect: SHUTTLE,
             posted_start_at: '2026-01-06 09:00:00', last_seen_at: '2026-01-05 10:00:05'}
          # Announced for tomorrow and still in the feed → kept.
          - {alert_id: announced_in_feed, route_id: Red, alert_effect: SHUTTLE,
             posted_start_at: '2026-01-06 09:00:00', last_seen_at: '2026-01-05 10:30:05'}
    expect:
      rows:
        - {alert_id: service_alert}
        - {alert_id: announced_in_feed}

  - name: resolved_lamp_alerts_the_snapshots_missed
    description: >
      LAMP supplies the alerts the snapshots never saw, before the capture
      start or since: each ends at its close, or its posted end if earlier.
      Alerts the snapshots saw, that were created before var lamp_alerts_start,
      that ended before starting, or that have neither a close nor a posted end
      are left out.
    model: mbta_alerts__resolved
    overrides: *resolved_vars
    given:
      - input: source('bronze', 'mbta_alerts')
        rows: *runs
      - input: ref('mbta_alerts__by_route')
        rows:
          # Also in LAMP: the snapshots' copy wins.
          - {alert_id: seen_by_snapshots, route_id: Red, alert_effect: DELAY,
             posted_start_at: '2026-01-05 09:00:00', last_seen_at: '2026-01-05 10:30:05'}
      - input: ref('lamp_alerts__by_route')
        rows:
          - {alert_id: closed, route_id: Red, alert_effect: DELAY, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-01 08:00:00', posted_end_at: '2025-06-01 10:00:00', alert_closed_at: '2025-06-01 08:40:00'}
          # Posted end (09:00) before the close (09:30) → the posted end.
          - {alert_id: posted_end_first, route_id: Red, alert_effect: DELAY, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-01 08:00:00', posted_end_at: '2025-06-01 09:00:00', alert_closed_at: '2025-06-01 09:30:00'}
          # Never closed → the posted end.
          - {alert_id: never_closed, route_id: Red, alert_effect: SHUTTLE, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-02 05:00:00', posted_end_at: '2025-06-02 23:00:00'}
          - {alert_id: seen_by_snapshots, route_id: Red, alert_effect: DELAY, alert_created_at: '2026-01-05 09:00:00',
             posted_start_at: '2026-01-05 09:00:00', alert_closed_at: '2026-01-05 10:40:00'}
          # Closed after the capture start, but the snapshots missed it.
          - {alert_id: ended_after_capture, route_id: Red, alert_effect: DELAY, alert_created_at: '2026-01-04 23:50:00',
             posted_start_at: '2026-01-04 23:50:00', alert_closed_at: '2026-01-05 00:10:00'}
          - {alert_id: before_lamp_start, route_id: Red, alert_effect: DELAY, alert_created_at: '2024-12-31 08:00:00',
             posted_start_at: '2024-12-31 08:00:00', alert_closed_at: '2024-12-31 09:00:00'}
          # Closed before its announced start → never took effect.
          - {alert_id: closed_before_start, route_id: Red, alert_effect: SHUTTLE, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-03 05:00:00', alert_closed_at: '2025-06-02 12:00:00'}
          - {alert_id: no_end_known, route_id: Red, alert_effect: DELAY, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-01 08:00:00'}
          - {alert_id: elevator, route_id: Red, alert_effect: ELEVATOR_CLOSURE, alert_created_at: '2025-06-01 08:00:00',
             posted_start_at: '2025-06-01 08:00:00', alert_closed_at: '2025-06-01 09:00:00'}
    expect:
      rows:
        - {alert_id: closed,            is_in_feed: false, alert_end_at: '2025-06-01 08:40:00'}
        - {alert_id: posted_end_first,  is_in_feed: false, alert_end_at: '2025-06-01 09:00:00'}
        - {alert_id: never_closed,      is_in_feed: false, alert_end_at: '2025-06-02 23:00:00'}
        - {alert_id: seen_by_snapshots, is_in_feed: true,  alert_end_at: null}
        - {alert_id: ended_after_capture, is_in_feed: false, alert_end_at: '2026-01-05 00:10:00'}

  # ── mbta_alerts__by_period ──────────────────────────────────────────────────

  - name: by_period_cuts_periods_where_the_alert_stopped
    description: >
      Each posted period ends at its own end or where the alert stopped (its
      close, or leaving the feed), whichever is first; a period after the alert
      stopped never happened. An open-ended period still in force has no end,
      and an alert that posted none is its resolved span.
    model: mbta_alerts__by_period
    given:
      # SQL rows, since the input has an array of periods.
      - input: ref('mbta_alerts__resolved')
        format: sql
        rows: |
          SELECT
              alert_id,
              'Red' AS route_id,
              active_periods,
              alert_start_at,
              alert_end_at,
              alert_closed_at,
              is_in_feed,
              left_feed_at
          FROM UNNEST([
              -- Posted for June 2–4, closed early on the 4th at 03:00.
              STRUCT(
                  'closed_early' AS alert_id,
                  [STRUCT(TIMESTAMP '2025-06-02 05:00:00' AS start_at, TIMESTAMP '2025-06-04 05:00:00' AS end_at)]
                      AS active_periods,
                  TIMESTAMP '2025-06-02 05:00:00' AS alert_start_at,
                  TIMESTAMP '2025-06-04 03:00:00' AS alert_end_at,
                  TIMESTAMP '2025-06-04 03:00:00' AS alert_closed_at,
                  FALSE AS is_in_feed,
                  CAST(NULL AS TIMESTAMP) AS left_feed_at
              ),
              -- Three weekends posted, closed before the third.
              STRUCT(
                  'weekends',
                  [
                      STRUCT(TIMESTAMP '2025-06-07 07:00:00', TIMESTAMP '2025-06-09 07:00:00'),
                      STRUCT(TIMESTAMP '2025-06-14 07:00:00', TIMESTAMP '2025-06-16 07:00:00'),
                      STRUCT(TIMESTAMP '2025-06-21 07:00:00', TIMESTAMP '2025-06-23 07:00:00')
                  ],
                  TIMESTAMP '2025-06-07 07:00:00',
                  TIMESTAMP '2025-06-09 07:00:00',
                  TIMESTAMP '2025-06-18 12:00:00',
                  FALSE,
                  CAST(NULL AS TIMESTAMP)
              ),
              -- Open-ended and still in the feed.
              STRUCT(
                  'ongoing',
                  [STRUCT(TIMESTAMP '2025-06-02 05:00:00', CAST(NULL AS TIMESTAMP))],
                  TIMESTAMP '2025-06-02 05:00:00',
                  CAST(NULL AS TIMESTAMP),
                  CAST(NULL AS TIMESTAMP),
                  TRUE,
                  CAST(NULL AS TIMESTAMP)
              ),
              -- Open-ended, left the feed at 09:30.
              STRUCT(
                  'left_feed',
                  [STRUCT(TIMESTAMP '2025-06-02 08:00:00', CAST(NULL AS TIMESTAMP))],
                  TIMESTAMP '2025-06-02 08:00:00',
                  TIMESTAMP '2025-06-02 09:30:00',
                  CAST(NULL AS TIMESTAMP),
                  FALSE,
                  TIMESTAMP '2025-06-02 09:30:00'
              ),
              -- Posted no period.
              STRUCT(
                  'no_period',
                  CAST([] AS ARRAY<STRUCT<start_at TIMESTAMP, end_at TIMESTAMP>>),
                  TIMESTAMP '2025-06-02 08:00:00',
                  TIMESTAMP '2025-06-02 08:45:00',
                  TIMESTAMP '2025-06-02 08:45:00',
                  FALSE,
                  CAST(NULL AS TIMESTAMP)
              )
          ])
    expect:
      rows:
        - {alert_id: closed_early, period_start_at: '2025-06-02 05:00:00', period_end_at: '2025-06-04 03:00:00'}
        - {alert_id: weekends,     period_start_at: '2025-06-07 07:00:00', period_end_at: '2025-06-09 07:00:00'}
        - {alert_id: weekends,     period_start_at: '2025-06-14 07:00:00', period_end_at: '2025-06-16 07:00:00'}
        - {alert_id: ongoing,      period_start_at: '2025-06-02 05:00:00', period_end_at: null}
        - {alert_id: left_feed,    period_start_at: '2025-06-02 08:00:00', period_end_at: '2025-06-02 09:30:00'}
        - {alert_id: no_period,    period_start_at: '2025-06-02 08:00:00', period_end_at: '2025-06-02 08:45:00'}

  # ── mbta_alerts__grouped ────────────────────────────────────────────────────
  # Alerts are Red Line, cause DISABLED_TRAIN, effect DELAY unless a test is
  # about one of those differing. incident_id is the incident's first alert.

  - name: grouped_follow_up_windows
    description: >
      An alert joins the incident when it starts within 2 hours of its latest
      end (the edge counts), or 6 hours when its header says "earlier" or
      "residual"; otherwise it starts a new one.
    model: mbta_alerts__grouped
    given:
      - input: ref('mbta_alerts__resolved')
        rows:
          - {alert_id: first, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: '2026-01-05 11:00:00'}
          # Starts exactly 2 hours after 11:00 → same incident.
          - {alert_id: at_two_hours, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 13:00:00', alert_end_at: '2026-01-05 13:30:00'}
          # Starts 2 hours 1 minute after 13:30 → new incident.
          - {alert_id: past_two_hours, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 15:31:00', alert_end_at: '2026-01-05 16:00:00'}
          # "Residual", 5 hours after 16:00 → within 6 hours, same incident.
          - {alert_id: residual_follow_up, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Residual delays at Harvard from an earlier disabled train',
             alert_start_at: '2026-01-05 21:00:00', alert_end_at: '2026-01-05 21:30:00'}
          # Same 5-hour gap without the wording → new incident.
          - {alert_id: plain_after_five_hours, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-06 02:30:00', alert_end_at: '2026-01-06 03:00:00'}
    expect:
      rows:
        - {alert_id: first,                  incident_id: first}
        - {alert_id: at_two_hours,           incident_id: first}
        - {alert_id: past_two_hours,         incident_id: past_two_hours}
        - {alert_id: residual_follow_up,     incident_id: past_two_hours}
        - {alert_id: plain_after_five_hours, incident_id: plain_after_five_hours}

  - name: grouped_window_runs_from_latest_end
    description: >
      The window runs from the latest end among the incident's alerts so far,
      not the previous alert's end; an ongoing alert counts as ending now.
    model: mbta_alerts__grouped
    given:
      - input: ref('mbta_alerts__resolved')
        rows:
          - {alert_id: long_alert, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: '2026-01-05 14:00:00'}
          # Ends at 11:00, inside long_alert.
          - {alert_id: short_update, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          # 4.5 hours after short_update's end, but 1.5 after long_alert's →
          # same incident.
          - {alert_id: after_latest_end, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 15:30:00', alert_end_at: '2026-01-05 16:00:00'}
          # Ongoing (no end) → any later alert at the same place joins it.
          - {alert_id: ongoing, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Kendall/MIT due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: null}
          - {alert_id: days_later, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Kendall/MIT due to a disabled train',
             alert_start_at: '2026-01-08 10:00:00', alert_end_at: '2026-01-08 11:00:00'}
    expect:
      rows:
        - {alert_id: long_alert,       incident_id: long_alert}
        - {alert_id: short_update,     incident_id: long_alert}
        - {alert_id: after_latest_end, incident_id: long_alert}
        - {alert_id: ongoing,          incident_id: ongoing}
        - {alert_id: days_later,       incident_id: ongoing}

  - name: grouped_keeps_different_events_apart
    description: >
      Overlapping alerts group only with the same route, cause, effect, and
      location. The location is the capitalized name after at/near/between/from,
      normalized so "at Harvard" and "near Harvard." match; alerts naming no
      location never group.
    model: mbta_alerts__grouped
    given:
      - input: ref('mbta_alerts__resolved')
        rows:
          - {alert_id: harvard, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: '2026-01-05 11:00:00'}
          # Different wording, same place → same incident.
          - {alert_id: near_harvard, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays near Harvard.',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          # Each of these differs in one way → its own incident.
          - {alert_id: other_station, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Kendall/MIT due to a disabled train',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          - {alert_id: other_cause, route_id: Red, alert_cause: SIGNAL_PROBLEM, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a signal problem',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          - {alert_id: other_effect, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: SUSPENSION,
             alert_header: 'Red Line suspended at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          - {alert_id: other_route, route_id: Orange, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Orange Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
          # No location named → never grouped, even with each other.
          - {alert_id: no_location, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: '2026-01-05 11:00:00'}
          - {alert_id: no_location_again, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays due to a disabled train',
             alert_start_at: '2026-01-05 10:30:00', alert_end_at: '2026-01-05 11:00:00'}
    expect:
      rows:
        - {alert_id: harvard,           incident_id: harvard,           alert_location_key: harvard}
        - {alert_id: near_harvard,      incident_id: harvard,           alert_location_key: harvard}
        - {alert_id: other_station,     incident_id: other_station,     alert_location_key: kendallmit}
        - {alert_id: other_cause,       incident_id: other_cause,       alert_location_key: harvard}
        - {alert_id: other_effect,      incident_id: other_effect,      alert_location_key: harvard}
        - {alert_id: other_route,       incident_id: other_route,       alert_location_key: harvard}
        - {alert_id: no_location,       incident_id: no_location,       alert_location_key: null}
        - {alert_id: no_location_again, incident_id: no_location_again, alert_location_key: null}

  - name: grouped_duration_of_upcoming_alerts
    description: >
      An alert announced ahead (it starts in the future) has no duration until
      it starts, unless it has a posted end, which gives its planned length.
    model: mbta_alerts__grouped
    given:
      - input: ref('mbta_alerts__resolved')
        rows:
          - {alert_id: ended, route_id: Red, alert_cause: DISABLED_TRAIN, alert_effect: DELAY,
             alert_header: 'Red Line delays at Harvard due to a disabled train',
             alert_start_at: '2026-01-05 10:00:00', alert_end_at: '2026-01-05 11:30:00'}
          # Starts in the future with no posted end → no duration yet.
          - {alert_id: upcoming_open_ended, route_id: Red, alert_cause: CONSTRUCTION, alert_effect: STATION_CLOSURE,
             alert_header: 'Davis will be closed until further notice',
             alert_start_at: '2099-01-05 10:00:00', alert_end_at: null}
          # Starts in the future with a posted end → its planned length.
          - {alert_id: upcoming_planned, route_id: Red, alert_cause: MAINTENANCE, alert_effect: SHUTTLE,
             alert_header: 'Shuttle buses replace Red Line trains between Alewife and Harvard',
             alert_start_at: '2099-01-05 10:00:00', alert_end_at: '2099-01-07 10:00:00'}
    expect:
      rows:
        - {alert_id: ended,               alert_duration_minutes: 90}
        - {alert_id: upcoming_open_ended, alert_duration_minutes: null}
        - {alert_id: upcoming_planned,    alert_duration_minutes: 2880}
