# Continuous integration: every push and pull request is checked without any
# cloud credentials — nothing here touches GCP.
#
#   python     ruff lint + pytest (ingest jobs, dashboard helpers)
#   dbt        dbt parse (project compiles) + sqlfluff lint (SQL style)
#   terraform  fmt check + validate (no backend, no state)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Docker images
          cache: pip
      - name: Install
        run: pip install -r ingest/requirements.txt pandas==3.0.6 pytest==8.4.2 ruff==0.14.0
      - name: Lint
        run: ruff check ingest serve
      - name: Test
        run: pytest

  dbt:
    name: dbt (parse + SQL lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt sqlfluff==3.0.3
      - name: Parse
        # Parsing checks refs, sources, macros, and YAML without a warehouse
        run: dbt parse --profiles-dir . --target gcp
      - name: Lint SQL
        run: sqlfluff lint models

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
